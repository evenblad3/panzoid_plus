<!DOCTYPE html >
<html lang = "en" >

<head >
    <meta charset = "utf-8" >
    <title >Panzoid+</title>

    <link rel = "stylesheet" href = "style.css" >

    <script defer src = "../public/effect.js" ></script>
    <script defer src = "../public/effects.js" ></script>

    <script defer src = "../public/effects/cartoon.js" ></script>
    <script defer src = "../public/effects/toon.js" ></script>
    <script defer src = "../public/effects/ascii.js" ></script>
    <script defer src = "../public/effects/halftone.js" ></script>
    <script defer src = "../public/effects/checkerboard.js" ></script>
    <script defer src = "../public/effects/grid.js" ></script>
    <script defer src = "../public/effects/griddler.js" ></script>
    <script defer src = "../public/effects/venetian_blinds.js" ></script>
    <script defer src = "../public/effects/tint.js" ></script>
    <script defer src = "../public/effects/color_expansion.js" ></script>
    <script defer src = "../public/effects/leave_color.js" ></script>
    <script defer src = "../public/effects/invert_channel.js" ></script>
    <script defer src = "../public/effects/chromatic_aberration.js" ></script>
    <script defer src = "../public/effects/colorisma.js" ></script>
    <script defer src = "../public/effects/blur_bokeh.js" ></script>
    <script defer src = "../public/effects/blur_directional_plus.js" ></script>
    <script defer src = "../public/effects/blur_edge.js" ></script>
    <script defer src = "../public/effects/blur_radial_plus.js" ></script>
    <script defer src = "../public/effects/blur_vector.js" ></script>
    <script defer src = "../public/effects/median.js" ></script>
    <script defer src = "../public/effects/oil_paint.js" ></script>
    <script defer src = "../public/effects/light_sweep.js" ></script>
    <script defer src = "../public/effects/vignette.js" ></script>
    <script defer src = "../public/effects/ghost.js" ></script>
    <script defer src = "../public/effects/shadow_drop.js" ></script>
    <script defer src = "../public/effects/shadow_inner.js" ></script>
    <script defer src = "../public/effects/satin.js" ></script>
    <script defer src = "../public/effects/ambient_occlusion.js" ></script>
    <script defer src = "../public/effects/stroke.js" ></script>
    <script defer src = "../public/effects/extrude.js" ></script>
    <script defer src = "../public/effects/mirror_plus.js" ></script>
    <script defer src = "../public/effects/turbulent_displace.js" ></script>
    <script defer src = "../public/effects/warp_waves.js" ></script>
    <script defer src = "../public/effects/split.js" ></script>
    <script defer src = "../public/effects/optics_compensation.js" ></script>
    <script defer src = "../public/effects/small_shake.js" ></script>
    <script defer src = "../public/effects/wiggle_shake.js" ></script>
    <script defer src = "../public/effects/left_right_shake.js" ></script>
    <script defer src = "../public/effects/rainbow_shake.js" ></script>
    <script defer src = "../public/effects/sharp_shake.js" ></script>
    <script defer src = "../public/effects/zoom_shake.js" ></script>

    <script defer src = "list.js" ></script>
    <script defer src = "search.js" ></script>
    <script defer src = "link.js" ></script>
    <script defer src = "tabs.js" ></script>
    <script defer src = "clipboard.js" ></script>
    <script defer src = "tweaks.js" ></script>
    <script defer src = "inspect.js" ></script>
</head>

<body class = "no_select" >
    <div class = "rail" >
        <button type = "button" id = "tab_effects" class = "rail_button rail_on" >Effects</button>
        <button type = "button" id = "tab_tweaks" class = "rail_button" >Tweaks</button>
        <button type = "button" id = "tab_inspect" class = "rail_button" >Inspect</button>
        <button type = "button" id = "tab_readme" class = "rail_button" >Readme</button>
    </div>

    <div class = "page" >
        <div class = "title_row" >
            <h1 class = "logo" >Panzoid+</h1>
            <span >
                <button type = "button" id = "youtube_button" class = "text_button" >youtube</button>
                <button type = "button" id = "github_button" class = "text_button" >github</button>
            </span>
        </div>

        <div id = "pane_effects" >
            <div class = "search_row" >
                <input type = "text" maxlength = "32" class = "search_field" placeholder = "type to filter" >
                <span id = "match_count" class = "match_count" ></span>
            </div>
            <div id = "no_matches" class = "empty no_select" hidden >nothing matches</div>
        </div>

        <div class = "pane_off" id = "pane_tweaks" >
            <div class = "tweak_note" >These only work while Panzoid+ is installed.
                They change how Clipmaker draws on this machine and are never saved
                into your clip, so nobody who opens your project gets them.</div>

            <label class = "tweak" >
                <span >Anisotropy
                    <span class = "tweak_hint" >todo description</span>
                </span>
                <input type = "checkbox" id = "tweak_anisotropy" >
                <span class = "toggle" ></span>
            </label>

            <label class = "tweak" >
                <span >Better shadows
                    <span class = "tweak_hint" >todo description</span>
                </span>
                <input type = "checkbox" id = "tweak_better_shadows" >
                <span class = "toggle" ></span>
            </label>

            <label class = "tweak" >
                <span >Fix stretched text
                    <span class = "tweak_hint" >todo description</span>
                </span>
                <input type = "checkbox" id = "tweak_fix_text_uv" >
                <span class = "toggle" ></span>
            </label>

            <label class = "tweak" >
                <span >Effects inside Clipmaker
                    <span class = "tweak_hint" >todo description</span>
                </span>
                <input type = "checkbox" id = "tweak_mount_effects" >
                <span class = "toggle" ></span>
            </label>

            <label class = "tweak" >
                <span >Precise values
                    <span class = "tweak_hint" >todo description</span>
                </span>
                <input type = "checkbox" id = "tweak_precise_values" >
                <span class = "toggle" ></span>
            </label>

            <label class = "tweak" >
                <span >Full resolution preview
                    <span class = "tweak_hint" >todo description</span>
                </span>
                <input type = "checkbox" id = "tweak_sharp_preview" >
                <span class = "toggle" ></span>
            </label>

        </div>

        <div class = "pane_off" id = "pane_readme" >
            <div class = "review_row" >
                <button type = "button" id = "review_button" class = "text_button" >leave a review</button>
            </div>

            <div class = "readme" >
                <p >todo description</p>
            </div>

        </div>

        <div class = "pane_off" id = "pane_inspect" >
            <div class = "drop_zone" id = "drop_zone" >
                drop a .pz or .clip here, or click to pick one
            </div>
            <input type = "file" id = "drop_file" accept = ".pz,.clip,.json" hidden >

            <div class = "inspect_summary" id = "inspect_summary" >nothing opened yet</div>
            <div class = "tree" id = "inspect_tree" ></div>

            <div class = "review_row" >
                <button type = "button" id = "inspect_save" class = "text_button" hidden >save the decoded settings</button>
            </div>

        </div>

    </div>

</body>

</html>
